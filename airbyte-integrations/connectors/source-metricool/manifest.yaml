spec:
  type: Spec
  connection_specification:
    type: object
    $schema: http://json-schema.org/draft-07/schema#
    required:
      - user_token
      - user_id
    properties:
      user_id:
        type: string
        description: Account ID
        order: 1
        title: User ID
      blog_ids:
        type: array
        description: >-
          Blog Ids which act as a quick identifier of metricool's entity which
          will be passed in the headers of the request
        order: 5
        title: Blog Ids
      end_date:
        type: string
        description: If not set, defaults to current datetime.
        order: 4
        title: End Date
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      timezone:
        type: string
        description: America/Buenos_Aires
        order: 2
        title: Timezone
        default: America/Buenos_Aires
      start_date:
        type: string
        description: >-
          If not set, defaults to 60 days back. If below "End Date", defaults to
          1 day before "End Date"
        order: 3
        title: Start Date
        format: date-time
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$
      user_token:
        type: string
        description: >-
          User token to authenticate API requests. Find it in the Account
          Settings menu, API section of your Metricool account.
        name: user_token
        order: 0
        title: User Token
        airbyte_secret: true
    additionalProperties: true

